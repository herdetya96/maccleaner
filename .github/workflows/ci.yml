name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python (web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Aturan Swift sinkron dengan rules.py
        run: python scripts/gen_swift_rules.py --check

  ui:
    name: Antarmuka (coss ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Typecheck & build
        working-directory: ui
        run: |
          npm ci
          npm run build

  macos:
    name: Desktop app + DMG
    runs-on: macos-15
    permissions:
      contents: write   # untuk menerbitkan Release saat push tag v*
    env:
      # Isi di GitHub → Settings → Secrets and variables → Actions.
      # Kalau kosong, DMG tetap dibuat tapi belum ditandatangani/dinotarisasi.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: swift --version

      - name: Tes logika inti
        working-directory: macos
        run: swift test

      - name: Pasang sertifikat Developer ID
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Sertifikat 'Developer ID Application' tidak ditemukan di MACOS_CERT_P12."
            exit 1
          fi
          echo "Identitas: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app & DMG
        run: ./scripts/make_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MacCleaner-DMG
          path: macos/build/MacCleaner-*.dmg

      - name: Terbitkan Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/build/MacCleaner-*.dmg \
            --title "MacCleaner $GITHUB_REF_NAME" \
            --notes "Unduh file .dmg di bawah, buka, lalu seret MacCleaner ke folder Aplikasi. Butuh macOS 13 atau lebih baru."

      - name: Hapus keychain sementara
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Versi web dengan Python bawaan macOS
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 -m maccleaner disks
