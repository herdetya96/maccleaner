<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1f5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Bentuk "squircle" standar ikon macOS (824px di kanvas 1024px) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Disk -->
  <g filter="url(#shadow)">
    <rect x="232" y="330" width="560" height="364" rx="64" fill="url(#disk)"/>
  </g>
  <!-- Batang pemakaian: hijau (aman dibersihkan) + abu-abu (terpakai) -->
  <rect x="292" y="560" width="440" height="64" rx="32" fill="#cbd5e1"/>
  <rect x="292" y="560" width="300" height="64" rx="32" fill="#1e3a8a"/>
  <rect x="486" y="560" width="106" height="64" fill="#22c55e"/>
  <rect x="540" y="560" width="52" height="64" rx="0" fill="#22c55e"/>
  <!-- Lampu status -->
  <circle cx="312" cy="410" r="22" fill="#22c55e"/>
  <!-- Kilau "bersih" -->
  <g fill="#ffffff">
    <path d="M770 160 l22 58 58 22 -58 22 -22 58 -22 -58 -58 -22 58 -22z"/>
    <path d="M664 196 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" opacity="0.85"/>
  </g>
</svg>
